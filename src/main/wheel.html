<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>wheel</title>
<style>
  /* 轮盘（radial / pie menu）。视觉跟悬浮气泡同一套语言：白底 + 两层柔投影。
   *
   * 形态是 **Wave Menu**：外环 = 当前这一层，内环 = 外环高亮项的子项，
   * 中心留死区 = 松手取消。选它是有依据的，不是图好看：
   *   ACHI 2024 那篇综述的原话 —— "Wave Menu presents new levels at the centre
   *   of the menu circle … Wave menus typically perform better than overlapping
   *   pie menus in which only one hierarchy level is visible at each time."
   *   也就是说"子级显示在圆心"比"点进去换一页"（一次只显示一层）表现更好。
   * muriel 的 radial-menus 规范里 sub-rings 与 nested Back 本来就是标准件：
   *   "Preserve one geometry primitive for every annular sector. Main rings,
   *    sub-rings, split bands, and decorative rails derive from it."
   *
   * 🔴 几何**不随 hover 变**（规范原话："Wedge boundaries do not move on hover,
   *    focus, selection"）—— 目标一动，肌肉记忆就废了，而且邻扇区会跟着挤。
   *    所以内环半径按**全局最大子项数**算一次定死，不是按当前高亮项算。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  #wheel {
    display: block;
    /* 跟气泡同款的两层投影：近景 1px/2px 贴着桌面，远景 3px/8px 轻浮起。
     * 出处 dsh-pet 修完之后正是"两层低透明度、最大 2px 偏移"。 */
    filter:
      drop-shadow(0 1px 2px rgba(25, 25, 28, 0.10))
      drop-shadow(0 3px 8px rgba(25, 25, 28, 0.15));
  }
  /* ---- 取色（2026-10-28 加底色）----
   *
   * 全部走 CSS 变量、一处定义（规矩 9）；开关只切 body.tint 这一组值。
   *
   * 🔴 **不透明**的有色面，不是毛玻璃 —— 两条依据，都不是拍脑袋：
   *   ① Momentum Design 原话「Transparency plus blur reduces contrast, so
   *      legibility must be verified, not assumed」：半透会让对比度**随壁纸漂**，
   *      桌宠底下是什么图根本不可控。
   *   ② Electron 透明窗采不到窗后的桌面，backdrop-filter 没有东西可糊（真要
   *      系统级材质得走 backgroundMaterial，仅 Win11）。气泡是纯白不透明，
   *      轮盘跟它一致。
   *
   * 数值是**算出来的**（debug/verify-wheel.js [H] 段在盯着，改色必红）：
   *   - 地板 WCAG 1.4.3 正文 4.5:1 / 1.4.11 图形与非文本 3:1。
   *     顺带修了个既存问题：次级文字原 #8e8e93 实测只有 **3.09:1**，不达标
   *     （那种"浅灰小字"看着精致，读起来就是在赌视力）→ 压到 #616166。
   *   - 悬停档差下限取 Material 的 hover state layer（8% 不透明度 ≈ 1.24），
   *     这里给到 1.42 / 1.64：轮盘是"划过去就松手"，**悬停是唯一的执行前反馈**，
   *     做到"勉强可辨"等于没反馈。
   *   - 环间差 ≥1.10：外环有色、内环更白，读起来才是"小圆盘浮在大圆环上"。 */
  :root {
    --s-outer: #ffffff;   /* 外环静息 */
    --s-hot:   #f4f5f5;   /* 悬停（外环与内环共用同一个高亮色） */
    --s-inner: #ffffff;   /* 内环静息 */
    --s-hub:   #ffffff;   /* 中心（取消区）*/
    --line:    #ececed;   /* 扇区分隔发丝线 */
    --ink:     #1d1d1f;
    --ink-2:   #616166;   /* 次级：当前值 / 中心提示（⚠️ 不能再退回 #8e8e93）*/
    --ink-kid: #48484a;
    --icon:    #5f5e5a;
  }
  /* 有底色（interaction.radialTint，默认开）。外环一层淡冷色 —— 冷色取自项目
   * 自己的取色（分隔线 #d8dee6 / 麦克风底 #eef2f6 那一档），不是另起一套。 */
  body.tint {
    --s-outer: #e4ebf7;
    --s-hot:   #adc9ed;
    --s-inner: #fafbfe;
    --s-hub:   #fafbfe;
    --line:    #c6d4e5;
  }
  .slot { fill: var(--s-outer); stroke: var(--line); stroke-width: 0.5; }
  .slot.kid { fill: var(--s-inner); }
  /* ⚠️ 高亮只有**一条**规则（外环内环同一色），且必须写在 .slot.kid 之后：
   *    两条规则特异度相同（都是 0-2-0），靠源码顺序决出胜负，
   *    谁在前谁就被覆盖 —— 别再拆出 .slot.kid.hot 那种第二条。 */
  .slot.hot { fill: var(--s-hot); }
  .slot.danger .lb { fill: #c0392b; }
  .slot.danger.hot { fill: #fdecec; }
  .lb {
    fill: var(--ink); font-size: 13px; text-anchor: middle;
    dominant-baseline: central; pointer-events: none;
  }
  .lb.sub { font-size: 11px; fill: var(--ink-2); }
  .lb.kid { font-size: 12px; fill: var(--ink-kid); }
  /* 高亮时内环文字必须跟着变深 —— 浅底上仍是灰字会看不清（截图实测）。 */
  .slot.hot .lb, .slot.hot .lb.kid { fill: var(--ink); }
  .ic { stroke: var(--icon); stroke-width: 1.6; fill: none;
        stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .slot.hot .ic { stroke: var(--ink); }
  .slot.danger .ic { stroke: #c0392b; }
  #hub { fill: var(--s-hub); stroke: var(--line); stroke-width: 0.5; }
  #hubText {
    fill: var(--ink-2); font-size: 12px; text-anchor: middle;
    dominant-baseline: central; pointer-events: none;
  }
  #wheel.nomotion { transition: none !important; }
  #stage { transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: no-preference) {
    /* 只做**入场**动画（惯例：animate the entry, not the exit —— 关闭要立刻）。 */
    #stage.pop { animation: pop 120ms cubic-bezier(0.2, 0.9, 0.3, 1.2); }
    @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  }
</style>
</head>
<body>
<svg id="wheel" xmlns="http://www.w3.org/2000/svg">
  <g id="stage"><g id="outer"></g><g id="inner"></g><circle id="hub" r="0"></circle><text id="hubText"></text></g>
</svg>
<script>
/* 图标来自 Lucide（lucide-static 1.63.0，ISC）—— 不手推 path，直接取现成的。
 * ISC 要求保留版权声明，README 的「第三方素材与授权」表已注明。 */
const ICONS = {
  smile: '<path d="M15 10V9" /> <path d="M16.472 15a6 6 0 01-8.943 0" /> <path d="M9 10V9" /> <circle cx="12" cy="12" r="10" />',
  hand: '<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" /> <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" /> <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" /> <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />',
  zoomIn: '<circle cx="11" cy="11" r="8" /> <line x1="21" x2="16.65" y1="21" y2="16.65" /> <line x1="11" x2="11" y1="8" y2="14" /> <line x1="8" x2="14" y1="11" y2="11" />',
  sun: '<circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" />',
  settings: '<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /> <circle cx="12" cy="12" r="3" />',
  volume2: '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />',
  eyeOff: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /> <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /> <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /> <path d="m2 2 20 20" />'
};

const svg = document.getElementById('wheel');
const stage = document.getElementById('stage');
const gOuter = document.getElementById('outer');
const gInner = document.getElementById('inner');
const hub = document.getElementById('hub');
const hubText = document.getElementById('hubText');

let items = [];          // 外环项（主进程下发）
let outer = -1;          // 当前高亮的外环下标（-1 = 没有）
let inner = -1;          // 当前高亮的内环下标
let geom = null;

const TAU = Math.PI * 2;
/* 起始角 -90°（正上）。研究结论：正轴向的扇区更好选、更好记，所以第一项
 * 落在正上方，项数取偶数时对称性最好（"even numbers of items are easier to
 * use and remember because more of the items are on-axis"）。 */
const START = -Math.PI / 2;
const GAP = 0.035;       // 扇区之间的视觉缝（弧度）。规范：visual gap < hit gap

/* 几何：内环厚度 32、外环厚度 44、中心死区半径 = innerIn - 2。
 * 由**全局最大子项数**决定一次，之后不再变（见顶部注释）。
 * ⚠️ 子项多的时候内环内径要外扩，否则最窄处（内缘弧长）不够点：
 *    8 项时内缘弧长 2πr/8，r=30 → 23.6px，r=30 是能给的极限，所以 8 项时
 *    把内径推到 30（26 会更窄）。 */
/* 几何与命中判定**不在这一层**。
 * 🔴 理由（踩过的坑，不是洁癖）：右键是在**主窗**上按下的，松手时鼠标很可能
 *    已经划到轮盘窗甚至别的窗口上方 —— mouseup 归哪个窗口是不确定的，
 *    而"鼠标移动事件由谁收到"同样不确定。所以命中判定改由**主进程轮询**
 *    `screen.getCursorScreenPoint()` 来算（与事件归属完全无关），这里只负责画。
 *    规矩 9：同一个公式只有一处定义 —— 几何在 wheel.js，页面只接收。 */

/* 环形扇区。⚠️ large-arc 位必须按 sweep 角算，不然跨 180° 的扇区会画反。 */
function sectorPath(r0, r1, a0, a1) {
  const p = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
  const [x0, y0] = p(r1, a0);
  const [x1, y1] = p(r1, a1);
  const [x2, y2] = p(r0, a1);
  const [x3, y3] = p(r0, a0);
  const big = (a1 - a0) > Math.PI ? 1 : 0;
  const f = (v) => Math.round(v * 100) / 100;
  return `M${f(x0)} ${f(y0)}A${r1} ${r1} 0 ${big} 1 ${f(x1)} ${f(y1)}`
    + `L${f(x2)} ${f(y2)}A${r0} ${r0} 0 ${big} 0 ${f(x3)} ${f(y3)}Z`;
}

function wedge(i, n, r0, r1) {
  const sweep = TAU / n;
  const a0 = START + i * sweep + GAP / 2;
  const a1 = START + (i + 1) * sweep - GAP / 2;
  return { d: sectorPath(r0, r1, a0, a1), mid: START + (i + 0.5) * sweep, r: (r0 + r1) / 2 };
}

const el = (tag, attrs) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

/* 图标：8×8 见方，放在标签上方（外环有竖向空间；内环太窄，只放文字）。 */
function addIcon(g, name, x, y, size) {
  const src = ICONS[name];
  if (!src) return;
  const wrap = el('g', {
    transform: `translate(${x - size / 2} ${y - size / 2}) scale(${size / 24})`,
    class: 'ic'
  });
  wrap.innerHTML = src;
  g.appendChild(wrap);
}

function drawOuter() {
  gOuter.textContent = '';
  const n = items.length || 1;
  items.forEach((it, i) => {
    const w = wedge(i, n, geom.outerIn, geom.outerOut);
    const g = el('g', { class: 'slot' + (it.danger ? ' danger' : '') });
    const p = el('path', { d: w.d });
    g.appendChild(p);
    const cx = Math.cos(w.mid) * w.r;
    const cy = Math.sin(w.mid) * w.r;
    const hasKids = Array.isArray(it.kids) && it.kids.length > 0;
    if (it.icon) addIcon(g, it.icon, cx, cy - (hasKids ? 14 : (it.sub ? 12 : 8)), 16);
    /* 带当前值的项拆成两行（"大小" + "100%"）：一行塞下"透明 100%"这种标签
     * 会横着溢出扇区 —— 左右两侧的扇区最窄，截图实测"朗读（关）"半个字悬在
     * 盘外。图标 / 主标签 / 值的竖排顺序固定，不许因内容换序。 */
    if (it.sub) {
      const t1 = el('text', { class: 'lb', x: cx, y: cy + (it.icon ? 8 : -4) });
      t1.textContent = it.label;
      const t2 = el('text', { class: 'lb sub', x: cx, y: cy + (it.icon ? 24 : 12) });
      t2.textContent = it.sub;
      g.appendChild(t1);
      g.appendChild(t2);
    } else {
      const t = el('text', { class: 'lb', x: cx, y: cy + (it.icon ? 12 : 0) });
      t.textContent = it.label;
      g.appendChild(t);
    }
    g.dataset.i = String(i);
    gOuter.appendChild(g);
  });
}

function drawInner() {
  gInner.textContent = '';
  const kids = outer >= 0 && Array.isArray(items[outer].kids) ? items[outer].kids : [];
  if (!kids.length) return;
  const n = kids.length;
  kids.forEach((k, i) => {
    const w = wedge(i, n, geom.innerIn, geom.innerOut);
    const g = el('g', { class: 'slot kid' + (k.danger ? ' danger' : '') });
    g.appendChild(el('path', { d: w.d }));
    const t = el('text', {
      class: 'lb kid',
      x: Math.cos(w.mid) * w.r,
      y: Math.sin(w.mid) * w.r
    });
    t.textContent = k.label;
    g.appendChild(t);
    g.dataset.i = String(i);
    gInner.appendChild(g);
  });
}

function paint() {
  const og = gOuter.children;
  for (let i = 0; i < og.length; i++) og[i].classList.toggle('hot', i === outer);
  const ig = gInner.children;
  for (let i = 0; i < ig.length; i++) ig[i].classList.toggle('hot', i === inner);
  hub.setAttribute('r', String(geom.dead));
  /* 中心写的是"当前在选什么"，不是装饰 —— 它同时是取消区，得说清楚松手会怎样。 */
  if (outer < 0) hubText.textContent = '取消';
  else if (inner >= 0) hubText.textContent = (items[outer].kids || [])[inner].label || '取消';
  else hubText.textContent = items[outer].label;
  hubText.setAttribute('y', '0');
}

function setActive(o, i) {
  const kidsChanged = o !== outer;
  outer = o;
  inner = o < 0 ? -1 : i;
  if (kidsChanged) drawInner();
  paint();
}

function reportSize() {
  const R = geom.R;
  const s = String(R * 2);
  svg.setAttribute('width', s);
  svg.setAttribute('height', s);
  svg.setAttribute('viewBox', `${-R} ${-R} ${R * 2} ${R * 2}`);
  window.wheelHost.reportSize(R * 2, R * 2, R);
}

function commit() {
  if (outer < 0) { window.wheelHost.cancel(); return; }
  const it = items[outer];
  const kids = Array.isArray(it.kids) ? it.kids : [];
  /* 有子项的组**必须选到子项**才算数：松手停在组上等于没选（= 取消）。
   * 这条让"划过去看一眼又反悔"永远安全，不需要额外的确认步骤。 */
  if (kids.length && inner < 0) { window.wheelHost.cancel(); return; }
  const pick = kids.length ? kids[inner] : it;
  window.wheelHost.pick(pick.id);
}

window.wheelHost.onShow((data) => {
  items = data.items || [];
  geom = data.geom;
  /* 底色开关（interaction.radialTint）。色值全在 CSS 变量里，这里只切 class ——
   * 主进程不认识颜色，换配色改一处即可（规矩 9）。 */
  document.body.classList.toggle('tint', data.tint !== false);
  outer = -1;
  inner = -1;
  drawOuter();
  drawInner();
  paint();
  reportSize();
  stage.classList.remove('pop');
  void stage.getBoundingClientRect();      // 强制重排，动画才会重播
  stage.classList.add('pop');
});

/* 主进程轮询算出的命中项（见顶部注释：不靠这一层的鼠标事件）。 */
window.wheelHost.onHover((h) => setActive(h.outer, h.inner));

/* 松手提交。**双保险**：主窗和这一层各有一个 mouseup 监听，谁先收到算谁 ——
 * 提交本身是幂等的（主进程只认第一次），所以重复触发无害。 */
window.addEventListener('mouseup', () => commit());
window.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => window.wheelHost.cancel());

/* 键盘等价物（规范硬性要求：radial 不能只有"方向"这一种入口）。
 * 左右 = 绕当前环旋转，上 = 进子项，下 = 退回外环，Enter 提交，Esc 关闭。 */
window.addEventListener('keydown', (e) => {
  const nOut = items.length || 1;
  const kids = outer >= 0 && Array.isArray(items[outer].kids) ? items[outer].kids : [];
  if (e.key === 'Escape') { window.wheelHost.cancel(); return; }
  if (e.key === 'Enter' || e.key === ' ') { commit(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (inner >= 0 && kids.length) setActive(outer, (inner + d + kids.length) % kids.length);
    else if (outer < 0) setActive(0, -1);
    else setActive((outer + d + nOut) % nOut, -1);
    e.preventDefault();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (e.key === 'ArrowDown') setActive(outer, -1);
    else if (outer >= 0 && kids.length) setActive(outer, Math.max(0, inner));
    else if (outer < 0) setActive(0, -1);
    e.preventDefault();
  }
});
</script>
</body>
</html>
